[pytest]
# Pytest configuration for Linux Timekpra integration
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests

# Coverage
addopts = 
    --cov=custom_components/linux_timekpra
    --cov-report=term-missing
    --cov-report=html

# Logging
log_cli = false
log_file = tests.log
log_file_level = DEBUG
